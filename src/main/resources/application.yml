spring:
  application:
    name: tasks-api

  # PostgreSQL database (no Docker).
  # By default it connects to the Postgres on your machine (localhost, database "tarefas").
  # During the training: DB_HOST = the trainer's IP (everyone uses the same "tarefas" database).
  # Set them as environment variables or change the values after the ':'.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tarefas}
    username: ${DB_USER:formando}
    password: ${DB_PASSWORD:formando}

  jpa:
    hibernate:
      # Hibernate creates/updates the tables from the entities.
      # Great for learning; in production you use migrations (Flyway or Liquibase).
      ddl-auto: update
    open-in-view: false
    # Prints the SQL generated by JPA to the console
    show-sql: true
