spring:
  application:
    name: tasks-api

  # PostgreSQL database shared by everyone in the training (database "tarefas" on the In-Nova server).
  # The password is not in the repo: set DB_PASSWORD with the value the trainer gives you.
  # To use a Postgres on your own machine instead: DB_HOST=localhost.
  datasource:
    url: jdbc:postgresql://${DB_HOST:13.140.28.157}:${DB_PORT:5432}/${DB_NAME:tarefas}
    username: ${DB_USER:formando}
    password: ${DB_PASSWORD:}
    hikari:
      # Everyone shares the trainer's Postgres: 3 connections per app instead of the default 10,
      # so it doesn't run out of connections.
      maximum-pool-size: 3

  jpa:
    hibernate:
      # Hibernate creates/updates the tables from the entities.
      # Great for learning; in production you use migrations (Flyway or Liquibase).
      ddl-auto: update
    open-in-view: false
    # Prints the SQL generated by JPA to the console
    show-sql: true
